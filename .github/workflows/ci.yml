name: NovaChat CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Test and build to catch any errors before touching the server
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install & Check Backend
      working-directory: ./Backend
      run: |
        npm install
        node --check server.js

    - name: Install & Build Frontend
      working-directory: ./Frontend
      run: |
        npm install
        npm run build

  # 2. Automatically deploy to EC2 when pushed to main
  deploy:
    needs: build-and-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Pull latest code
          cd ~/NovaChat
          git pull origin main

          # 2. Update Backend and restart PM2
          cd Backend
          npm install
          pm2 restart novachat-backend

          # 3. Update Frontend build for Nginx
          cd ../Frontend
          npm install
          npm run build
